<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .btn-loading .spinner {
        display: inline-block;
      }
      .btn-loading .btn-text {
        display: none;
      }
      .spinner {
        display: none;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .animate-spin-custom {
        animation: spin 1s linear infinite;
      }
    </style>
  </head>

  <body
    class="min-h-screen bg-gradient-to-br from-indigo-600 via-indigo-500 to-purple-600 flex items-center justify-center p-4"
  >
    <div
      class="w-full max-w-5xl bg-white rounded-3xl shadow-2xl overflow-hidden grid grid-cols-1 md:grid-cols-2"
    >
      <div
        class="hidden md:flex flex-col justify-center p-10 bg-gradient-to-br from-indigo-700 to-indigo-500 text-white"
      >
        <h1 class="text-4xl font-bold mb-4">RTPS Assist</h1>
        <p class="text-indigo-100 text-lg">
          Secure Admin Dashboard for managing government applications
          efficiently.
        </p>
      </div>

      <div class="p-8 md:p-12 flex flex-col justify-center">
        <h2 class="text-3xl font-bold text-slate-800 mb-2">Welcome Back 👋</h2>
        <p class="text-slate-500 mb-8">Login to your admin account</p>

        <form id="loginForm" class="space-y-5">
          <div>
            <label class="text-sm font-semibold text-slate-600">Email</label>
            <input
              type="email"
              id="email"
              required
              placeholder="admin@example.com"
              class="w-full mt-1 px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none transition-all"
            />
          </div>

          <div class="relative">
            <label class="text-sm font-semibold text-slate-600">Password</label>
            <div class="relative">
              <input
                type="password"
                id="password"
                required
                placeholder="••••••••"
                class="w-full mt-1 px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 pr-12 outline-none transition-all"
              />
              <button
                type="button"
                onclick="togglePassword()"
                class="absolute right-3 top-1/2 -translate-y-1/2 mt-0.5 text-slate-400 hover:text-indigo-600 transition-colors"
              >
                <svg
                  id="eye-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="2"
                  stroke="currentColor"
                  class="w-5 h-5"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M2.036 12.322a1.012 1.012 0 010-.644C3.399 8.049 7.21 5 12 5c4.79 0 8.601 3.049 9.964 6.322a1.012 1.012 0 010 .644C20.601 15.951 16.79 19 12 19c-4.79 0-8.601-3.049-9.964-6.322z"
                  />
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                  />
                </svg>
              </button>
            </div>
          </div>

          <p
            id="errorMsg"
            class="text-red-500 text-sm hidden bg-red-50 p-3 rounded-lg border border-red-100"
          ></p>

          <button
            type="submit"
            id="submitBtn"
            class="w-full py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition shadow-lg flex items-center justify-center gap-3 disabled:opacity-70 disabled:cursor-not-allowed"
          >
            <svg
              class="spinner animate-spin-custom h-5 w-5 text-white"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
              ></path>
            </svg>
            <span class="btn-text">Login</span>
            <span class="spinner">Verifying...</span>
          </button>
        </form>
      </div>
    </div>

    <script>
      // Anti-DevTools Logic
      (function () {
        document.addEventListener("contextmenu", (e) => e.preventDefault());
        document.addEventListener("keydown", function (e) {
          if (
            e.key === "F12" ||
            (e.ctrlKey &&
              e.shiftKey &&
              (e.key === "I" || e.key === "J" || e.key === "C")) ||
            (e.ctrlKey && e.key === "U")
          ) {
            e.preventDefault();
          }
        });

        const detectDevTools = () => {
          const start = new Date();
          debugger;
          const end = new Date();
          if (end - start > 100) {
            document.body.innerHTML = `<div style="display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;background:#0f172a;color:white;text-align:center"><div><h1 style="font-size:32px">⚠ Access Restricted</h1><p>Developer tools are not allowed on this panel.</p></div></div>`;
          }
        };
        setInterval(detectDevTools, 1000);
      })();

      function togglePassword() {
        const passwordInput = document.getElementById("password");
        const eyeIcon = document.getElementById("eye-icon");
        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.822 7.822L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />`;
        } else {
          passwordInput.type = "password";
          eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.644C3.399 8.049 7.21 5 12 5c4.79 0 8.601 3.049 9.964 6.322a1.012 1.012 0 010 .644C20.601 15.951 16.79 19 12 19c-4.79 0-8.601-3.049-9.964-6.322z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />`;
        }
      }

      const loginForm = document.getElementById("loginForm");
      const submitBtn = document.getElementById("submitBtn");
      const errorMsg = document.getElementById("errorMsg");

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        // UI Feedback: Start Loading
        errorMsg.classList.add("hidden");
        submitBtn.classList.add("btn-loading");
        submitBtn.disabled = true;

        try {
          const res = await fetch(
            "https://backend-5gc912wx6-wasimsonu76-gmailcoms-projects.vercel.app/api/auth/login",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            },
          );

          const data = await res.json();

          if (!res.ok) {
            throw new Error(data.message || "Invalid credentials");
          }

          // Save Auth Data
          localStorage.setItem("token", data.token);
          localStorage.setItem("email", email);

          // Route based on email
          const targetPage =
            email === "wasimanwar9344@gmail.com"
              ? "/superadmin.html"
              : "/admin.html";

          setTimeout(() => {
            window.location.href = targetPage;
          }, 600);
        } catch (err) {
          // UI Feedback: Stop Loading
          submitBtn.classList.remove("btn-loading");
          submitBtn.disabled = false;
          errorMsg.innerText = err.message;
          errorMsg.classList.remove("hidden");
        }
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verifying Payment | R2PS.in</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: #f8fafc;
      }
      .ps-card {
        background: white;
        border-radius: 2rem;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        padding: 2.5rem;
        max-width: 450px;
        width: 100%;
        text-align: center;
        border: 1px solid #e2e8f0;
      }
      .ps-loader {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #6366f1;
        border-radius: 50%;
        width: 60px;
        height: 60px;
        animation: spin 1s linear infinite;
        margin: 0 auto;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .progress-container {
        width: 100%;
        background-color: #e2e8f0;
        border-radius: 10px;
        height: 6px;
        margin: 1.5rem 0;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background-color: #6366f1;
        width: 0%;
        transition: width 6s linear;
      }
      .status-icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 1.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        font-size: 2.5rem;
        font-weight: bold;
      }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center p-6">
    <div class="ps-card">
      <div id="icon-container" class="mb-6">
        <div class="ps-loader" id="loader"></div>
      </div>

      <h2
        id="ps-title"
        class="text-2xl font-extrabold text-slate-900 mb-4 tracking-tight"
      >
        Verifying Payment
      </h2>

      <p id="ps-message" class="text-slate-500 font-medium mb-6">
        We are verifying your payment with the bank. Please do not refresh or go
        back.
      </p>

      <div class="progress-container" id="progress-bar">
        <div class="progress-fill" id="fill"></div>
      </div>

      <div id="action-area" class="hidden">
        <p
          class="text-xs text-slate-400 mb-4 font-bold uppercase tracking-widest"
        >
          Redirecting to dashboard...
        </p>
        <button
          onclick="goToDashboard()"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-2xl font-bold transition-all shadow-lg shadow-indigo-100"
        >
          Go to Dashboard
        </button>
      </div>
    </div>

    <script>
      const API_BASE =
        "https://backend-5gc912wx6-wasimsonu76-gmailcoms-projects.vercel.app/api";
      let redirectTimer = null;
      let hasCalledApi = false;

      function goToDashboard() {
        if (redirectTimer) clearTimeout(redirectTimer);
        window.location.href = "admin.html";
      }

      async function verifyPayment() {
        if (hasCalledApi) return;

        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get("order_id")?.trim();
        const docType = decodeURIComponent(
          urlParams.get("document_type") || "",
        )?.trim();
        const userId = urlParams.get("user_id")?.trim();

        const progressFill = document.getElementById("fill");
        const actionArea = document.getElementById("action-area");

        // Start progress bar visual
        setTimeout(() => {
          progressFill.style.width = "100%";
        }, 100);

        if (!orderId || !docType || !userId) {
          showStatus(
            "failed",
            "Invalid Session",
            "Missing payment details from the URL.",
          );
          return;
        }

        hasCalledApi = true;

        try {
          const response = await fetch(
            `${API_BASE}/payments/verify/${docType}/${orderId}/${userId}`,
          );
          const data = await response.json();

          if (data.success && data.status === "SUCCESS") {
            showStatus(
              "success",
              "Payment Confirmed",
              "Transaction successful! Your application status has been updated.",
            );
          } else if (data.status === "PENDING") {
            showStatus(
              "pending",
              "Payment Pending",
              "Your payment is currently pending. Please check your dashboard in a few minutes.",
            );
          } else {
            showStatus(
              "failed",
              "Payment Failed",
              data.message || "The transaction was declined or cancelled.",
            );
          }
        } catch (error) {
          showStatus(
            "failed",
            "Connection Error",
            "We couldn't reach the bank server. If money was debited, your status will update within 24 hours.",
          );
        } finally {
          actionArea.classList.remove("hidden");
          redirectTimer = setTimeout(goToDashboard, 6000);
        }
      }

      function showStatus(type, title, message) {
        const titleEl = document.getElementById("ps-title");
        const msgEl = document.getElementById("ps-message");
        const iconContainer = document.getElementById("icon-container");

        titleEl.innerText = title;
        msgEl.innerText = message;

        if (type === "success") {
          iconContainer.innerHTML = `<div class="status-icon bg-emerald-100 text-emerald-600">✓</div>`;
          titleEl.className =
            "text-2xl font-extrabold text-emerald-600 mb-4 tracking-tight";
        } else if (type === "failed") {
          iconContainer.innerHTML = `<div class="status-icon bg-rose-100 text-rose-600">✕</div>`;
          titleEl.className =
            "text-2xl font-extrabold text-rose-600 mb-4 tracking-tight";
        } else if (type === "pending") {
          iconContainer.innerHTML = `<div class="status-icon bg-amber-100 text-amber-600">!</div>`;
          titleEl.className =
            "text-2xl font-extrabold text-amber-600 mb-4 tracking-tight";
        }
      }

      window.onload = verifyPayment;
    </script>
  </body>
</html>

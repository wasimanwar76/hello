<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verifying Payment | R2PS.in</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: #f8fafc;
      }
      .ps-card {
        background: white;
        border-radius: 2rem;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        padding: 2.5rem;
        max-width: 450px;
        width: 100%;
        text-align: center;
        border: 1px solid #e2e8f0;
      }
      .ps-loader {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #6366f1;
        border-radius: 50%;
        width: 60px;
        height: 60px;
        animation: spin 1s linear infinite;
        margin: 0 auto;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .progress-container {
        width: 100%;
        background-color: #e2e8f0;
        border-radius: 10px;
        height: 6px;
        margin: 1.5rem 0;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background-color: #6366f1;
        width: 0%;
        transition: width 3s linear; /* Faster transition */
      }
      .status-icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 1.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        font-size: 2.5rem;
        font-weight: bold;
      }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center p-6">
    <div class="ps-card">
      <div id="icon-container" class="mb-6">
        <div class="ps-loader" id="loader"></div>
      </div>

      <h2
        id="ps-title"
        class="text-2xl font-extrabold text-slate-900 mb-4 tracking-tight"
      >
        Verifying Payment...
      </h2>

      <p id="ps-message" class="text-slate-500 font-medium mb-6">
        Please wait while we confirm your transaction with the bank. Do not
        close this window.
      </p>

      <div class="progress-container" id="progress-bar">
        <div class="progress-fill" id="fill"></div>
      </div>

      <div id="action-area" class="hidden">
        <p
          class="text-xs text-slate-400 mb-4 font-bold uppercase tracking-widest"
        >
          Redirecting in <span id="countdown">5</span> seconds...
        </p>
        <button
          onclick="goHome()"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-2xl font-bold transition-all shadow-lg shadow-indigo-100"
        >
          Go to Home
        </button>
      </div>
    </div>

    <script>
      // --- CONFIGURATION ---
      // CHANGE THIS TO YOUR LIVE SERVER URL WHEN DEPLOYING
      const API_BASE = "https://paymentconfig.vercel.app/api";

      let hasCalledApi = false;

      function goHome() {
        window.location.href = "apply.html"; // Redirect to Home/Landing page
      }

      async function verifyPayment() {
        if (hasCalledApi) return;

        // 1. Get Order ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get("order_id")?.trim();

        // 2. Start Progress Bar Animation
        const progressFill = document.getElementById("fill");
        setTimeout(() => {
          progressFill.style.width = "90%";
        }, 100);

        // 3. Check for Order ID
        if (!orderId) {
          showStatus(
            "failed",
            "Invalid Request",
            "Order ID is missing from the URL.",
          );
          return;
        }

        hasCalledApi = true;

        try {
          console.log("Verifying Order:", orderId);

          // 4. Call Node.js Server (POST Request)
          const response = await fetch(`${API_BASE}/payment/verify`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ orderId: orderId }),
          });

          const data = await response.json();

          // 5. Handle Response
          setTimeout(() => {
            progressFill.style.width = "100%"; // Finish bar

            if (data.success && data.status === "COMPLETE") {
              showStatus(
                "success",
                "Payment Successful!",
                "Your application has been submitted successfully.",
              );
            } else if (data.status === "PENDING") {
              showStatus(
                "pending",
                "Payment Pending",
                "We are still waiting for bank confirmation. Please check back later.",
              );
            } else {
              showStatus(
                "failed",
                "Payment Failed",
                "The transaction could not be completed.",
              );
            }

            startRedirectTimer();
          }, 1500); // Small delay for UX
        } catch (error) {
          console.error("Verification Error:", error);
          showStatus(
            "failed",
            "Connection Error",
            "Could not reach the server. Please check your internet.",
          );
          startRedirectTimer();
        }
      }

      // --- UI HELPERS ---
      function showStatus(type, title, message) {
        const titleEl = document.getElementById("ps-title");
        const msgEl = document.getElementById("ps-message");
        const iconContainer = document.getElementById("icon-container");
        const progressBar = document.getElementById("progress-bar");
        const actionArea = document.getElementById("action-area");

        titleEl.innerText = title;
        msgEl.innerText = message;
        progressBar.style.display = "none"; // Hide bar when done
        actionArea.classList.remove("hidden");

        if (type === "success") {
          iconContainer.innerHTML = `<div class="status-icon bg-emerald-100 text-emerald-600">✓</div>`;
          titleEl.className =
            "text-2xl font-extrabold text-emerald-600 mb-4 tracking-tight";
        } else if (type === "failed") {
          iconContainer.innerHTML = `<div class="status-icon bg-rose-100 text-rose-600">✕</div>`;
          titleEl.className =
            "text-2xl font-extrabold text-rose-600 mb-4 tracking-tight";
        } else {
          iconContainer.innerHTML = `<div class="status-icon bg-amber-100 text-amber-600">!</div>`;
          titleEl.className =
            "text-2xl font-extrabold text-amber-600 mb-4 tracking-tight";
        }
      }

      function startRedirectTimer() {
        let seconds = 5;
        const countEl = document.getElementById("countdown");
        const interval = setInterval(() => {
          seconds--;
          if (countEl) countEl.innerText = seconds;
          if (seconds <= 0) {
            clearInterval(interval);
            goHome();
          }
        }, 1000);
      }

      // Run on Load
      window.onload = verifyPayment;
    </script>
  </body>
</html>
